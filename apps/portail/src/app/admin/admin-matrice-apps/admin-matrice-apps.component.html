<div class="card shadow-sm mb-4">
  <div class="card-body d-flex align-items-center gap-3">
    <h5 class="mb-0">Sélectionner un Groupe :</h5>
    <select class="form-select w-auto" [(ngModel)]="selectedgroupe_idForApps">
      @for (grp of groupes; track grp.id) {
        <option [ngValue]="grp.id">{{ grp.nom }}</option>
      }
    </select>
  </div>
</div>

@if (selectedgroupe_idForApps) {
  <table class="table table-striped table-hover align-middle shadow-sm bg-white">
    <thead class="table-dark">
      <tr>
        <th>Application</th>
        <th>Chemin</th>
        <th class="text-center">Incluse dans le groupe</th>
      </tr>
    </thead>
    <tbody>
      @for (app of applications; track app.id) {
        <tr>
          <td class="fw-bold">{{ app.nom }}</td>
          <td><small class="text-muted">{{ app.url_path }}</small></td>
          <td class="text-center">
            <div class="form-check d-inline-block">
              <input class="form-check-input" type="checkbox"
                     [checked]="isAppInGroupe(selectedgroupe_idForApps, app.id)"
                     (change)="toggleAppGroupe(selectedgroupe_idForApps, app.id, $event)">
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
